<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Eleagent">
  <title>Eleagent</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/assets/manifest.webmanifest">
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <main>
    <video id="preview" autoplay playsinline muted aria-label="Camera preview"></video>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <section id="observation" class="observation" aria-label="Latest observation" hidden>
      <p id="observation-age" class="observation-age"></p>
      <p id="observation-text" class="observation-text" aria-live="polite"></p>
    </section>
    <p id="toast" class="toast" role="status" aria-live="polite" hidden></p>
    <div class="controls">
      <div class="lead">
        <!-- Okou: grey until Eleagent is connected to the owner's Okou, in colour once it is (app.js). -->
        <button id="okou" class="okou" aria-label="Connect Okou" data-connected="false">
          <svg viewBox="0 0 800 803" width="26" height="26" aria-hidden="true"><path d="M603.905 167.457C589.107 72.5824 507.091 0 408.052 0H391.948C292.909 0 210.893 72.5824 196.095 167.457C84.6763 187.186 0 284.43 0 401.5C0 518.57 84.6763 615.814 196.095 635.543C210.893 730.418 292.909 803 391.948 803H408.052C507.091 803 589.107 730.418 603.905 635.543C715.324 615.814 800 518.57 800 401.5C800 284.43 715.324 187.186 603.905 167.457ZM533.446 462.622C489.972 557.593 394.947 607.255 321.248 573.551C247.549 539.798 223.031 435.446 266.554 340.475C310.028 245.504 405.054 195.842 478.752 229.546C552.451 263.299 576.969 367.651 533.446 462.622Z"/></svg>
        </button>
      </div>
      <button id="shutter" class="shutter" aria-label="Record" disabled><span></span></button>
      <button id="flip" class="flip" aria-label="Switch camera" disabled>
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 10.5A7.6 7.6 0 0 0 6 6.3L4.5 7.8"/><path d="M4.5 3.5v4.3h4.3"/><path d="M4.5 13.5A7.6 7.6 0 0 0 18 17.7l1.5-1.5"/><path d="M19.5 20.5v-4.3h-4.3"/></svg>
      </button>
    </div>
  </main>
</body>
</html>
