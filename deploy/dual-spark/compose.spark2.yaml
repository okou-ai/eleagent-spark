name: eleagent-spark2

x-recognition-environment: &recognition-environment
  ARCHIVE_URL: http://${SPARK2_ADDRESS:?Set the private Spark 2 address}:22401
  SCENE_ARCHIVE_TOKEN: ${SCENE_ARCHIVE_TOKEN:?Generate the shared archive token}
  ENTITY_WEIGHTS_DIR: /models/entities
  ELEAGENT_TIMEZONE: ${ELEAGENT_TIMEZONE:-America/Los_Angeles}
  HOME: /tmp
  METRICS_ADDR: 127.0.0.1

services:
  archive:
    image: local/eleagent-archive:production
    build:
      context: ../../services/archive
    container_name: eleagent-archive
    network_mode: host
    restart: unless-stopped
    user: "10001:10001"
    command: ["uvicorn", "app.archive_server:create_archive_app", "--factory", "--host", "${SPARK2_ADDRESS}", "--port", "22401"]
    environment:
      SCENE_ARCHIVE_TOKEN: ${SCENE_ARCHIVE_TOKEN}
      SCENE_ARCHIVE_ROOT: /data/archive/media
      SCENE_ARCHIVE_DB: /data/archive/archive.sqlite3
      SCENE_ARCHIVE_RESERVE_BYTES: ${ARCHIVE_RESERVE_BYTES:-107374182400}
      METRICS_SERVICE: archive
      METRICS_PORT: "9201"
      METRICS_ADDR: 127.0.0.1
    volumes:
      - ${DATA_ROOT:?Set DATA_ROOT}/archive:/data/archive
    stop_grace_period: 60s

  recognition:
    image: local/eleagent-recognition:production
    build:
      context: ../../services/recognition
      target: objects
      args:
        RECOGNITION_BASE_IMAGE: ${RECOGNITION_BASE_IMAGE:-python:3.12-slim}
        REUSE_INSTALLED_TORCH: ${REUSE_INSTALLED_TORCH:-0}
    container_name: eleagent-recognition
    network_mode: host
    user: "1000:1000"
    restart: unless-stopped
    gpus: all
    environment:
      <<: *recognition-environment
      METRICS_SERVICE: recognition
      METRICS_PORT: "9202"
      YOLO_CONFIG_DIR: /tmp/ultralytics
    volumes:
      - ${DATA_ROOT}/recognition:/data
      - ${MODEL_ROOT:?Set MODEL_ROOT}/entities:/models/entities:ro
    depends_on: [archive]
    stop_grace_period: 120s

  speech:
    image: local/eleagent-speech:production
    build:
      context: ../../services/recognition
      target: speech
      args:
        RECOGNITION_BASE_IMAGE: ${RECOGNITION_BASE_IMAGE:-python:3.12-slim}
        REUSE_INSTALLED_TORCH: ${REUSE_INSTALLED_TORCH:-0}
    container_name: eleagent-speech
    # Every clip is analysed on arrival with the clip(s) held from before it; finished turns go to the archive at once,
    # a turn still running waits for the next clip (or 8 s of idle). Catching up takes 2 new clips at a time.
    # None of this is part of the speech pipeline id: no history is reprocessed.
    command: ["-m", "entity_worker.speech", "--window-clips", "2", "--idle-seconds", "8"]
    network_mode: host
    user: "1000:1000"
    restart: unless-stopped
    gpus: all
    environment:
      <<: *recognition-environment
      ASR_LANGUAGE: ${ASR_LANGUAGE:-}
      METRICS_SERVICE: speech
      METRICS_PORT: "9203"
    volumes:
      - ${DATA_ROOT}/recognition:/data
      - ${MODEL_ROOT}/entities:/models/entities:ro
      - ${MODEL_ROOT}/campplus:/models/campplus:ro
      - ${MODEL_ROOT}/qwen3-asr-1.7b:/models/qwen3-asr-1.7b:ro
    depends_on: [archive]
    stop_grace_period: 120s

  text:
    image: local/eleagent-text:production
    build:
      context: ../../services/recognition
      target: ocr
    container_name: eleagent-text
    network_mode: host
    user: "1000:1000"
    restart: unless-stopped
    environment:
      <<: *recognition-environment
      OCR_MODEL_DIR: /models/ocr
      METRICS_SERVICE: text
      METRICS_PORT: "9205"
    volumes:
      - ${DATA_ROOT}/recognition:/data
      - ${MODEL_ROOT}/ocr:/models/ocr:ro
    depends_on: [archive]

  graph-sync:
    image: local/eleagent-graph-sync:production
    build:
      context: ../..
      dockerfile: services/graph-sync/Dockerfile
    container_name: eleagent-graph-sync
    network_mode: host
    user: "1000:1000"
    group_add: ["10001"]
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Generate the graph password}
      GRAPH_URL: bolt://${SPARK1_ADDRESS:?Set the private Spark 1 address}:7687
      ARCHIVE_DB: /archive/archive.sqlite3
      ENTITY_STATE_PATH: /entities/entities.sqlite
      ELEAGENT_TIMEZONE: ${ELEAGENT_TIMEZONE:-America/Los_Angeles}
      METRICS_SERVICE: graph-sync
      METRICS_PORT: "9204"
      METRICS_ADDR: 127.0.0.1
    volumes:
      - ${DATA_ROOT}/archive:/archive:ro
      - ${DATA_ROOT}/recognition:/entities
    depends_on: [archive, recognition]

  # Local VLM (vLLM, OpenAI-compatible on 127.0.0.1:22410) for naming and the day agent. Tool calls (qwen3_coder: the
  # model writes <tool_call><function=...> XML) serve the agent; thinking is off by default (short structured answers);
  # prefix caching reuses the fixed system prompts. 0.40 of the GB10's unified memory leaves the other Spark 2 services
  # their headroom. The GPU manager stops it at night. Another model: put it in MODEL_ROOT and set VLM_MODEL_DIR.
  vlm:
    image: ${VLM_IMAGE:-nvcr.io/nvidia/vllm:26.09-py3}
    container_name: eleagent-vlm
    network_mode: host
    ipc: host
    shm_size: 8g
    restart: unless-stopped
    gpus: all
    command:
      - vllm
      - serve
      - /models/vlm
      - --served-model-name
      - ${NAMING_VLM_MODEL:-qwen3.6-35b-a3b}
      - --host
      - 127.0.0.1
      - --port
      - "22410"
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "8"
      - --gpu-memory-utilization
      - ${VLM_GPU_MEMORY_UTILIZATION:-0.40}
      - --limit-mm-per-prompt
      - '{"image": 2, "video": 0}'
      - --enable-prefix-caching
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
    volumes:
      - ${MODEL_ROOT}/${VLM_MODEL_DIR:-qwen3.6-35b-a3b-fp8}:/models/vlm:ro
    stop_grace_period: 30s

  # Spoken object naming ("这是我的蓝色水杯"): archive speech turns -> local VLM intent + grounding -> named memory
  # object + its :ObjectView views + :NamingEvent, under the graph-sync / sleep writer lock. CPU only (the VLM is the
  # vlm service above); DINOv2-S is loaded on CPU only when a VLM box overlaps no strong detection.
  naming:
    image: local/eleagent-naming:production
    build:
      context: ../../services/recognition
      dockerfile: naming/Dockerfile
      args:
        NAMING_BASE_IMAGE: local/eleagent-recognition:production
    container_name: eleagent-naming
    network_mode: host
    user: "1000:1000"
    group_add: ["10001"]
    restart: unless-stopped
    environment:
      <<: *recognition-environment
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Generate the graph password}
      GRAPH_URL: bolt://${SPARK1_ADDRESS:?Set the private Spark 1 address}:7687
      ARCHIVE_DB: /archive/archive.sqlite3
      VLM_URL: ${NAMING_VLM_URL:-http://127.0.0.1:22410/v1}
      VLM_MODEL: ${NAMING_VLM_MODEL:-qwen3.6-35b-a3b}
      YOLO_CONFIG_DIR: /tmp/ultralytics
    volumes:
      - ${DATA_ROOT}/archive:/archive:ro
      - ${MODEL_ROOT}/entities:/models/entities:ro
    depends_on: [archive, vlm]
    stop_grace_period: 30s

  # Day agent: hears the user ask Okou for help while recording (local VLM), writes one self-contained message with
  # the moment's context (time, place, transcript, people and things in view, memory) and hands it to Okou through
  # api.okou.ai/mcp. The Okou access token comes from graph-api on Spark 1 over the Spark link (AGENT_INTERNAL_ADDR).
  agent:
    image: local/eleagent-agent:production
    build:
      context: ../../services/recognition
      dockerfile: agent/Dockerfile
      args:
        AGENT_BASE_IMAGE: local/eleagent-naming:production
    container_name: eleagent-agent
    network_mode: host
    user: "1000:1000"
    group_add: ["10001"]
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Generate the graph password}
      GRAPH_URL: bolt://${SPARK1_ADDRESS:?Set the private Spark 1 address}:7687
      ARCHIVE_DB: /archive/archive.sqlite3
      VLM_URL: ${NAMING_VLM_URL:-http://127.0.0.1:22410/v1}
      VLM_MODEL: ${NAMING_VLM_MODEL:-qwen3.6-35b-a3b}
      ELEAGENT_TIMEZONE: ${ELEAGENT_TIMEZONE:-America/Los_Angeles}
      OKOU_TOKEN_URL: http://${AGENT_INTERNAL_ADDR:-10.100.24.1:22404}/internal/okou/token
      AGENT_INTERNAL_TOKEN_FILE: /agent/internal.token
      OKOU_AGENT_ID: ${OKOU_AGENT_ID:-}
    volumes:
      - ${DATA_ROOT}/archive:/archive:ro
      - ${DATA_ROOT}/agent:/agent:ro
    depends_on: [archive, vlm]
    stop_grace_period: 20s
